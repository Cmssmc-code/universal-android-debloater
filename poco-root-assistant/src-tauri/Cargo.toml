[package]
name = "poco-root-assistant"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "Assistant guidé et semi-automatique pour rooter un POCO X6 5G (garnet) avec Magisk"

# Empty workspace table keeps this crate isolated from the parent `uad_gui`
# package that lives at the repository root.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pra_core = { path = "../core" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
zip = "2"
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = true
strip = true

[package]
name = "pra_core"
version = "0.1.0"
edition = "2021"
description = "Pure parsing and flow logic for Poco Root Assistant (no I/O, fully unit-testable)"
license = "GPL-3.0"

# Empty workspace table: keeps this crate isolated from the parent `uad_gui`
# package so it can be built/tested on its own.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
